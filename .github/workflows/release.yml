name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run, for attaching assets to a tag whose release already exists —
  # e.g. after fixing a bad upload path. Checks out the tag, so the build matches
  # what that tag contains rather than whatever main holds now.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v2.0.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      # On a manual run, build the tag the user named rather than the default
      # branch, so re-attaching assets cannot ship different code than the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build
      # Bundles land under the workspace-root target dir, not src-tauri/target:
      # src-tauri is a member of the Cargo workspace defined in the root
      # Cargo.toml, so cargo puts all build output at the workspace root. The
      # glob pointed at src-tauri/target/release/bundle, a path that never
      # exists, so every release since the initial commit published with no
      # assets — the installers attached to earlier tags were uploaded by hand.
      - name: List built bundles
        shell: bash
        run: |
          echo "bundle tree:"
          find target/release/bundle -type f -print | sed 's/^/  /'
      - uses: softprops/action-gh-release@v2
        with:
          # A manual run has no tag ref of its own, so name the target release
          # explicitly; the action then updates it in place instead of failing.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            target/release/bundle/**/*
          fail_on_unmatched_files: true
